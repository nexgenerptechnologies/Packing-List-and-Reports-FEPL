<style>
    @media print {
        .label-page {
            page-break-after: always;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    }
    .label-card {
        border: 3px solid #333;
        padding: 25px;
        width: 450px;
        text-align: left;
        font-family: Arial, Helvetica, sans-serif;
    }
    .label-header {
        font-size: 1.5em;
        font-weight: bold;
        text-align: center;
        text-decoration: underline;
        margin-bottom: 20px;
    }
    .field-label {
        font-weight: bold;
        width: 120px;
        display: inline-block;
    }
    .field-value {
        font-size: 1.2em;
    }
    .row {
        margin-bottom: 12px;
    }
</style>

{% for item in doc.items %}
    <div class="label-page">
        <div class="label-card">
            <div class="label-header">ITEM LABEL</div>
            
            <div class="row">
                <span class="field-label">Customer:</span>
                <span class="field-value">{{ doc.customer_name }}</span>
            </div>
            <div class="row">
                <span class="field-label">Invoice No:</span>
                <span class="field-value">{{ doc.sales_invoice }}</span>
            </div>
            <hr>
            <div class="row">
                <span class="field-label">Item Code:</span>
                <span class="field-value">{{ item.item_code }}</span>
            </div>
            <div class="row">
                <span class="field-label">Item Name:</span>
                <span class="field-value">{{ item.item_name }}</span>
            </div>
            <div class="row">
                <span class="field-label">CPN:</span>
                <span class="field-value">{{ item.custom_cpn or "N/A" }}</span>
            </div>
            <div class="row">
                <span class="field-label">Total Qty:</span>
                <span class="field-value">{{ item.quantity }}</span>
            </div>
            <div class="row">
                <span class="field-label">Box Number:</span>
                <span class="field-value">{{ item.box_number or "N/A" }}</span>
            </div>
        </div>
    </div>
{% endfor %}
